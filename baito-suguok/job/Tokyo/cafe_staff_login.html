<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員専用ログイン | Cafe de Nerika</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #efede9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: #8d6e63; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #8d6e63;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #6d4c41; }
        #staff-content { display: none; text-align: left; margin-top: 20px; border-top: 2px solid #8d6e63; padding-top: 20px; }
        .hint {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="login-box" id="login-container">
        <h2>STAFF LOGIN</h2>
        <div id="login-form">
            <input type="text" id="staff-name" placeholder="名前 (ローマ字)">
            <input type="password" id="staff-pass" placeholder="パスワード">
            <button onclick="login()">ログイン</button>
        </div>

        <div id="staff-content">
            <h3 id="welcome-msg"></h3>
            <div id="login-hint-box" style="display: none; background: #fdfdfd; border: 1px solid #eee; padding: 15px; margin-top: 10px;">
                <p style="font-size: 0.9rem; color: #333; margin: 0; line-height: 1.6;">
                    名前は下の名前ローマ字、<br>
                    パスワードは採用年月日です。
                </p>
                <div style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc;">
                    <p style="font-size: 0.8rem; font-weight: bold; color: #8d6e63;">【登録スタッフ一覧】</p>
                    <p style="font-size: 0.75rem; color: #666; font-family: monospace;">
                        rei / kenji / yumi / daiki / hana / ryo / maki / shota / nana / kaito / ai / yuu
                    </p>
                </div>
            </div>
            <button onclick="location.reload()" style="background-color: #999; margin-top: 20px;">戻る</button>
        </div>

        <div class="hint">
            0000 0000
        </div>
    </div>

    <script>
        const staffData = {
            "rei": "20090319",
            "0000": "0000",
            "yuu": "20091006",
            "kenji": "20080401",
            "yumi": "20080512",
            "daiki": "20080620",
            "hana": "20080707",
            "ryo": "20080815",
            "maki": "20080930",
            "shota": "20081111",
            "nana": "20081224",
            "kaito": "20090105",
            "ai": "20090214"
        };

        function login() {
            const name = document.getElementById('staff-name').value.toLowerCase().trim();
            const pass = document.getElementById('staff-pass').value.trim();

            if (staffData[name] && staffData[name] === pass) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('staff-content').style.display = 'block';
                
                let displayName = name;
                if (name === "yuu") displayName = "矢木優";
                if (name === "rei") displayName = "九条れい";
                
                document.getElementById('welcome-msg').textContent = "Login Success: " + displayName;
                
                // yuuでログインした場合の特別な業務連絡
                if (name === "yuu") {
                    const portal = document.getElementById('staff-content');
                    portal.innerHTML += `
                        <div style="background: #fff5f5; border: 1px solid #ffcdd2; padding: 15px; margin-top: 15px;">
                            <p style="color: #c62828; font-weight: bold; margin-top: 0;">【個別メッセージ】</p>
                            <p style="font-size: 0.9rem; color: #333;">九条さん、昨日の片付けありがとうございました。<br>
                            例のレシピの件、店長が話したがっていました。</p>
                            <p style="font-size: 0.9rem; color: #333; margin-top: 10px;">
                            好きなものは、「キミ」だよ。逆にしてパスワードにしてる。<br>
                            早く結婚したいなぁ。
                            </p>
                        </div>
                    `;
                }

                if (name === "0000") {
                    document.getElementById('login-hint-box').style.display = 'block';
                }
            } else {
                alert("認証に失敗しました。名前（ローマ字）またはパスワードを確認してください。");
            }
        }
    </script>
</body>
</html>
