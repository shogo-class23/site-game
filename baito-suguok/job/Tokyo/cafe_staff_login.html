<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員専用ログイン | Cafe de Nerika</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #efede9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: #8d6e63; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #8d6e63;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #6d4c41; }
        #staff-content { display: none; text-align: left; margin-top: 20px; border-top: 2px solid #8d6e63; padding-top: 20px; }
        .hint {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="login-box" id="login-container">
        <h2>STAFF LOGIN</h2>
        <div id="login-form">
            <input type="text" id="staff-name" placeholder="名前 (ローマ字)">
            <input type="password" id="staff-pass" placeholder="パスワード (採用年月日8桁)">
            <button onclick="login()">ログイン</button>
        </div>

        <div id="staff-content">
            <h3 id="welcome-msg"></h3>
            <p style="color: #d9534f; font-weight: bold;">【重要：業務連絡】</p>
            <ul style="font-size: 0.9rem;">
                <li>3月のお祭りフェアのレシピを更新しました。</li>
                <li>「れい」さんが考案した焼きそばのソース配分は厳守してください。</li>
                <li>備品の在庫チェックをお願いします。</li>
            </ul>
            <p style="font-size: 0.8rem; color: #666; margin-top: 20px;">※ログイン成功。名前は下の名前ローマ字、パスワードは採用年月日です。</p>
            <button onclick="location.reload()" style="background-color: #999; margin-top: 10px;">ログアウト</button>
        </div>

        <div class="hint">
            test:0000 0000
        </div>
    </div>

    <script>
        const staffData = {
            "rei": "20090319",
            "test": "00000000"
        };

        function login() {
            const name = document.getElementById('staff-name').value.toLowerCase().trim();
            // パスワードからスペースを除去して判定
            const pass = document.getElementById('staff-pass').value.replace(/\s+/g, "");

            if (staffData[name] && staffData[name] === pass) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('staff-content').style.display = 'block';
                document.getElementById('welcome-msg').textContent = "お疲れ様です、" + name + "さん。";
            } else {
                alert("認証に失敗しました。名前（ローマ字）またはパスワードを確認してください。");
            }
        }
    </script>
</body>
</html>
